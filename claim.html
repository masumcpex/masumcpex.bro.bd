<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>প্রগ্রেস ক্লেইম মেকার | Masum</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0f6b5c">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#1f2430;--mut:#667085;--line:#d9dee5;--acc:#0f6b5c;--accd:#0a5448}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:'Noto Sans Bengali',system-ui,sans-serif;color:var(--ink);background:#e8ebef;display:flex;flex-direction:column}
:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.top{background:#fff;border-bottom:1px solid var(--line);padding:10px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.top b{color:var(--acc);font-size:18px;margin-right:auto}
.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px 12px;font:inherit;font-size:14px;cursor:pointer}
.btn.p{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
.btn:disabled{opacity:.6;cursor:wait}
.tabs{display:none;background:#fff;border-bottom:1px solid var(--line)}
.tabs button{flex:1;border:0;background:none;padding:11px;font:inherit;font-weight:600;color:var(--mut);border-bottom:3px solid transparent}
.tabs button.on{color:var(--acc);border-color:var(--acc)}
.work{flex:1;min-height:0;display:grid;grid-template-columns:minmax(380px,46%) 1fr;gap:14px;padding:14px}
.form,.stage{overflow:auto;min-height:0}
.form{background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px}
.form h3{font-size:15px;margin:18px 0 8px;color:var(--acc)}
.form h3:first-child{margin-top:0}
.g{display:grid;grid-template-columns:1fr 1fr;gap:8px}
label{font-size:12.5px;color:var(--mut);display:block}
input[type=text],input[type=number]{width:100%;border:1px solid var(--line);border-radius:6px;padding:7px 8px;font:inherit;font-size:14px;margin-top:2px}
.sc{overflow-x:auto}
table.in{border-collapse:collapse;min-width:560px;width:100%;font-size:13px}
table.in th{font-weight:600;color:var(--mut);text-align:left;padding:4px;font-size:12px;white-space:nowrap}
table.in td{padding:2px}
table.in input{margin:0;padding:6px;font-size:13px}
.am{text-align:right;white-space:nowrap;padding-right:6px}
.x{border:0;background:none;color:#b42318;font-size:18px;cursor:pointer;padding:0 6px}
.lot{border:1px solid var(--line);border-radius:8px;padding:10px;margin-bottom:10px}
.lh{display:flex;gap:8px;margin-bottom:6px}
.sm{font-size:13px;padding:6px 10px}
.chk{display:flex;gap:8px;align-items:center;margin-top:10px;font-size:14px;color:var(--ink)}
.stage{padding-bottom:20px}
#wrap{margin:0 auto;position:relative}
#sheets{transform-origin:top left;position:absolute;left:0;top:0;width:816px}
.sheet{width:816px;height:1054px;background:#fff;padding:48px 44px;font-family:Arial,Helvetica,sans-serif;font-size:11px;color:#000;box-shadow:0 2px 12px rgba(20,30,50,.18);margin-bottom:16px;overflow:hidden}
.pdf .sheet{box-shadow:none;margin:0}
.fr{border:1px solid #000}
.t{text-align:center;font-weight:700;padding:3px;border-bottom:1px solid #000}
.info{display:grid;grid-template-columns:140px 1fr 120px 1fr;row-gap:9px;white-space:nowrap;padding:5px 6px}
.info span:nth-child(4n+2),.info span:nth-child(4n){padding-left:6px}
.main{display:grid;grid-template-columns:44% 56%;border-top:1px solid #000;height:540px}
.l{border-right:1px solid #000;display:flex;flex-direction:column}
.l .h{padding:4px 6px;border-bottom:1px solid #000;height:24px}
.lt{display:grid;grid-template-columns:28% 40% 32%;border-bottom:1px solid #000;padding:2px 0;height:22px;align-items:center}
.lt>*{padding:0 6px}
.lb{flex:1}
.lr{display:grid;grid-template-columns:28% 40% 32%;height:18px;align-items:center}
.lr>*{padding:0 6px}
.lr .a,.lt .a{text-align:right}
.lbx{margin:0 0 14px auto;width:32%;border:1px solid #000;text-align:right;padding:3px 6px}
.rr{display:grid;grid-template-columns:30px 150px 14px 1fr;min-height:27px;align-items:center;padding-right:6px}
.rr .v{text-align:right}
.rr .v.bx{border:1px solid #000;padding:3px 6px;font-weight:400}
.due{display:grid;grid-template-columns:44% 56%;border-top:1px solid #000}
.due div{padding:10px 6px;font-weight:700}
.sg{display:grid;grid-template-columns:1fr 1fr;gap:70px;margin-top:20px}
.sg .ln{border-bottom:1px solid #000;height:34px;margin-bottom:8px}
.sg .nm{display:grid;grid-template-columns:50px 1fr;margin-top:6px}
table.d{border-collapse:collapse;width:100%;font-size:11px}
table.d th,table.d td{border:1px solid #000;padding:1px 4px;height:15px}
table.d th{text-align:center;font-weight:700;height:36px}
table.d td.n{text-align:right}
table.d td.c{text-align:center}
table.d tr.bl td{border-top:0;border-bottom:0}
table.d tr.sp td{border-top:0}
table.d tr.lotr td{border-bottom:0}

.sheet:not(.ms){margin-left:auto;margin-right:auto}
.pdf .sheet{margin:0}
.sheet.ms{width:1056px;height:auto;min-height:816px;padding:28px 30px;font-size:9px}
.mh{display:flex;justify-content:space-between;font-size:10px;line-height:1.5;margin-bottom:8px}
table.m{border-collapse:collapse;width:100%;table-layout:fixed;font-size:9px}
table.m th,table.m td{border:1px solid #444;padding:1px 2px;height:15px;overflow:hidden}
table.m th{text-align:center;font-weight:700;background:#f4f4f4}
table.m th.bn{font-size:7.5px;font-weight:400}
table.m td.c{text-align:center}table.m td.n{text-align:right}table.m td.z{font-size:7.5px}
table.m tr.gr td{font-weight:700;text-decoration:underline;background:#fafafa}
table.m tr.tt td{font-weight:700}
table.m td.xx{background:repeating-linear-gradient(45deg,#fff 0 2px,#222 2px 3px)}
table.in.cm{min-width:0;width:auto}
table.in.cm th.cc{font-size:10.5px;text-align:center;white-space:nowrap;padding:2px 3px}
table.in input[data-f="d"]{min-width:150px}
input.ci{width:44px;text-align:center;padding:5px 2px}
select{width:100%;border:1px solid var(--line);border-radius:6px;padding:7px 8px;font:inherit;font-size:14px;margin-top:2px;background:#fff}
@media print{.ms{display:none!important}}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#1f2430;color:#fff;padding:10px 18px;border-radius:8px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:9}
#toast.show{opacity:1}
@media (max-width:900px){
 .tabs{display:flex}
 .work{grid-template-columns:1fr;padding:10px}
 .work[data-v=f] .stage,.work[data-v=p] .form{display:none}
}
@media print{
 @page{size:letter;margin:0}
 body{display:block;background:#fff;height:auto}
 .top,.tabs,.form,#toast{display:none!important}
 .work,.stage,#wrap{display:block!important;padding:0!important;overflow:visible!important;height:auto!important;width:auto!important}
 #sheets{position:static!important;transform:none!important}
 .sheet{box-shadow:none;margin:0;page-break-after:always}
}
</style>
</head>
<body>
<header class="top">
 <b>প্রগ্রেস ক্লেইম মেকার</b>
 <a class="btn" id="back" href="index.html#/tools" style="text-decoration:none">← টুলস</a>
 <button class="btn" id="b-clear" type="button">ফর্ম খালি করো</button>
 <button class="btn" id="b-print" type="button">প্রিন্ট</button>
 <button class="btn" id="b-meas" type="button" style="display:none">মেজারমেন্ট শিট PDF</button>
 <button class="btn p" id="b-pdf" type="button">ক্লেইম PDF</button>
</header>
<nav class="tabs" id="tabs"><button type="button" data-v="f" class="on">ফর্ম</button><button type="button" data-v="p">প্রিভিউ</button></nav>
<main class="work" id="work" data-v="f">
 <section class="form" id="form"></section>
 <section class="stage" id="stage"><div id="wrap"><div id="sheets"></div></div></section>
</main>
<div id="toast" role="status" aria-live="polite"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<script>
(function(){
'use strict';
var $=function(i){return document.getElementById(i)},KEY='claim_v2';
var num=function(v){var n=parseFloat(v);return isFinite(n)?n:0};
var f2=function(n){return n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})};
var isX=function(v){return String(v).trim().toLowerCase()==='x'};

var SYS={unit:'a1/3, a5/7, b1/3, b2/2a, b5/7, b6/8, b9/11, b10/12, b11/15, b12a/16, b17/19',lot:'Lot 01, Lot 02, Lot 03, Lot 04, Lot 05, Lot 06',floor:'GF, MEZZA, 1F, 2F, 3F, ROOF',room:'Living, Master Bedroom, Bedroom 2, Kitchen, Bath 1, Bath 2'};
var SYSU={unit:2,lot:1,floor:1,room:1,custom:1};
var ITEMS=[['Marking',0.6,300,0],['Internal Cornerbead',2,528.68,1],['External Cornerbead',2,333,1],['Grooveline',2,37.5,1],['Grooveline Kok 150mm',2,14.6,1],['Warehouse Cornerbead',2,115,1]];
function lot(name,wd){return{name:name,rows:ITEMS.map(function(it,i){return{z:'',d:it[0],u:'m2',rate:it[1],qty:it[2],wd:wd[i],pct:100,sub:it[3],c:[]}})}}
function mk(spec){return spec.split('\n').map(function(l){var p=l.split('|');return{z:p[0],d:p[1],u:p[2],rate:(p[2]==='m2'&&/Marking/.test(p[1]))?0.5:2,qty:'',wd:'',pct:90,sub:0,c:[]}})}
function blockGroups(){return[
 {name:'TYPE B *36UNIT',rows:mk('GF-PART2|Internal Bead|m\nGF-PART2|Marking|m2\nGF-WHOLE|Internal Bead|m\nGF-WHOLE|Marking|m2\nGF-BAL|Internal Bead|m\nGF-BAL|Marking|m2\nMEZZA-WHOLE|Internal Bead|m\nMEZZA-WHOLE|Marking|m2\n1F-WHOLE|Internal Bead|m\n1F-WHOLE|Marking|m2\nRoof&w.tank|External Bead|m\nST(GF-1F)|Internal Bead|m\nST(GF-1F)|Marking|m2\nOffice(Front)|External Bead|m\nOffice(Side)|External Bead|m\nPRODUCTION|Internal Bead *Shear Wall|m\nPRODUCTION|Marking *Shear Wall|m2\nPRODUCTION|Internal Bead *Front|m\nPRODUCTION|Marking *Front|m2\nPRODUCTION|Internal Bead *Rear|m\nPRODUCTION|External Bead *Rear|m\nPRODUCTION|Marking *Rear|m2\nPRODUCTION|Internal Bead *Side|m\nPRODUCTION|External Bead *Side|m\nPRODUCTION|Marking *Side|m2\nloading|External Bead|m')},
 {name:'TNB *4UNIT',rows:mk('|Internal Bead|m\n|External Bead|m\n|Marking|m2')},
 {name:'TNB *FENCING - External Plaster (+CHOP&EXMENT)',rows:mk('|Tnb Fencing 1|m2\n|Tnb Fencing 2&3|m2\n|Tnb Fencing 4|m2')}]}
function sample(){return{co:'PRIMA TILING AND RENOVATION',claimNo:'2',date:'31.03.2026',project:'Kejora Sunsuria',incharge:'',sub:'Nasnum',trade:'Corner Bead',contact:'Nil',scope:'Cornerbead',contractValue:'',
 variation:'',retPct:'5',daywork:'',prevAsAt:'',backcharged:'',release:'',showCE:false,prepName:'CPEX',prepDate:'',recvName:'',recvDate:'',fname:'Progress-Claim-02',
 useBlocks:false,bsys:'unit',btext:SYS.unit,bdef:2,
 prev:[{date:'',desc:'Advance',amt:'2000'},{date:'',desc:'Received',amt:'4130.81'},{date:'',desc:'Advance',amt:'530'}],
 lots:[lot('Lot 17',[2,2,2,2,1,2]),lot('Lot 13',[2,2,2,2,2,0]),lot('Lot 09',[2,2,1,1,1,0])]}}
var S=sample();
try{var sv=JSON.parse(localStorage.getItem(KEY)||'null');if(sv&&sv.lots)S=sv}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function toast(m){var t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(function(){t.classList.remove('show')},2600)}

function blocks(){return String(S.btext||'').split(/[,\n]+/).map(function(s){return s.trim()}).filter(Boolean).map(function(s){var p=s.split(':');return{n:p[0].trim(),u:p[1]?num(p[1]):(num(S.bdef)||1)}})}
function cellsFix(){var n=blocks().length;S.lots.forEach(function(l){l.rows.forEach(function(r){r.c=r.c||[];while(r.c.length<n)r.c.push('');r.c.length=n})})}
function wd(r){return S.useBlocks?(r.c||[]).reduce(function(a,v){return a+(isX(v)?0:num(v))},0):num(r.wd)}
function amt(r){return num(r.rate)*num(r.qty)*wd(r)*(r.pct===''?1:num(r.pct)/100)}
function calc(){
 var A=0;S.lots.forEach(function(l){l.rows.forEach(function(r){A+=amt(r)})});
 var B=num(S.variation),C=A+B,D=C*num(S.retPct)/100,dw=num(S.daywork);
 var E=C-D+dw,P=0;S.prev.forEach(function(p){P+=num(p.amt)});
 return{A:A,B:B,C:C,D:D,E:E,P:P,due:E-P-num(S.prevAsAt)-num(S.backcharged)+num(S.release)}
}

/* ---------- ফর্ম ---------- */
function field(k,label,type){return '<div><label>'+label+'<input type="'+(type||'text')+'"'+(type==='number'?' step="any" inputmode="decimal"':'')+' data-k="'+k+'" value="'+esc(S[k])+'"></label></div>'}
function ni(a,f,v,w){return '<td'+(w?' style="width:'+w+'px"':'')+'><input type="number" step="any" inputmode="decimal" '+a+'data-f="'+f+'" value="'+esc(v)+'"></td>'}
function buildForm(){
 var B=blocks(),bm=S.useBlocks;
 var h='<h3>শুরু করুন</h3><div class="g"><div><label>টেমপ্লেট<select id="tpl"><option value="">— বাছাই করুন —</option><option value="simple">সরল (লট ভিত্তিক) নমুনা</option><option value="block">ব্লক শিট (Type B / TNB)</option></select></label></div><div style="align-self:end"><button class="btn sm" type="button" id="tpl-go">লোড করুন</button></div></div>'+
 '<h3>প্রধান তথ্য</h3><div class="g">'+field('co','কোম্পানির নাম')+field('fname','PDF ফাইলের নাম')+field('claimNo','Progress Claim No.')+field('date','Date')+field('project','Project')+field('incharge','Person in-charge')+field('sub','Sub-Contractor')+field('trade','Trade')+field('contact','Contact No')+field('scope','Scope of Work')+field('contractValue','Contract Value')+'</div>'+
 '<h3>ব্লক / রুম সিস্টেম</h3><label class="chk" style="margin:0 0 8px"><input type="checkbox" id="ub"'+(bm?' checked':'')+'> ব্লক মোড (ব্লকভিত্তিক মেজারমেন্ট শিট)</label>';
 if(bm)h+='<div class="g"><div><label>প্রজেক্টের সিস্টেম<select id="bsys">'+[['unit','ব্লক + ইউনিট (a1/3, a5/7)'],['lot','লট (Lot 01…)'],['floor','ফ্লোর / লেভেল (GF, 1F…)'],['room','রুম (Living, Bath…)'],['custom','নিজের মতো']].map(function(o){return '<option value="'+o[0]+'"'+(S.bsys===o[0]?' selected':'')+'>'+o[1]+'</option>'}).join('')+'</select></label></div>'+field('bdef','প্রতি ব্লকে ইউনিট (ডিফল্ট)','number')+'</div><label style="margin-top:8px">ব্লক/রুমের তালিকা (কমা বা নতুন লাইন দিয়ে আলাদা; আলাদা ইউনিট হলে নাম:৩)<textarea data-k="btext" rows="3" style="width:100%;border:1px solid var(--line);border-radius:6px;padding:7px 8px;font:inherit;font-size:14px;margin-top:2px">'+esc(S.btext)+'</textarea></label><div style="font-size:12.5px;color:var(--mut);margin-top:4px">মোট '+B.length+'টি ব্লক</div>';
 h+='<h3>পূর্বের পেমেন্ট (Previous Payment)</h3><div class="sc"><table class="in"><tr><th>Date</th><th>Description</th><th>Amount</th><th></th></tr>';
 S.prev.forEach(function(p,i){var a='data-p="'+i+'" ';h+='<tr><td><input type="text" '+a+'data-f="date" value="'+esc(p.date)+'"></td><td><input type="text" '+a+'data-f="desc" value="'+esc(p.desc)+'"></td>'+ni(a,'amt',p.amt)+'<td><button class="x" type="button" data-delp="'+i+'" aria-label="মুছুন">×</button></td></tr>'});
 h+='</table></div><button class="btn sm" type="button" id="add-p">+ পেমেন্ট যোগ করুন</button><h3>হিসাব</h3><div class="g">'+field('variation','Variation Work (B)','number')+field('retPct','Retention %','number')+field('daywork','Daywork/Additional Work','number')+field('prevAsAt','Previous as at','number')+field('backcharged','Daywork/back-charged','number')+field('release','Add: Release of retention','number')+'</div>'+
 '<label class="chk"><input type="checkbox" id="ce"'+(S.showCE?' checked':'')+'> C ও E ঘরে সংখ্যা দেখাও</label><h3>কাজের হিসাব</h3>';
 S.lots.forEach(function(l,li){
  h+='<div class="lot"><div class="lh"><input type="text" data-ln="'+li+'" value="'+esc(l.name)+'" aria-label="গ্রুপ/লটের নাম"><button class="btn sm" type="button" data-dup="'+li+'">কপি</button><button class="x" type="button" data-dell="'+li+'" aria-label="মুছুন">×</button></div><div class="sc"><table class="in"><tr>'+(bm?'<th>Item/Zone</th>':'')+'<th>Description</th><th>Unit</th><th>Rate</th><th>'+(bm?'Qty (মিটার/ইউনিট)':'Qty')+'</th><th>কাজ হয়েছে</th><th>%</th><th title="লটের মোট Qty-তে ধরো">Σ</th><th class="am">Amount</th><th></th></tr>';
  l.rows.forEach(function(r,ri){
   var a='data-l="'+li+'" data-r="'+ri+'" ',k=li+'_'+ri;
   h+='<tr>'+(bm?'<td style="width:90px"><input type="text" '+a+'data-f="z" value="'+esc(r.z)+'"></td>':'')+'<td><input type="text" '+a+'data-f="d" value="'+esc(r.d)+'"></td><td style="width:54px"><input type="text" '+a+'data-f="u" value="'+esc(r.u)+'"></td>'+ni(a,'rate',r.rate,70)+ni(a,'qty',r.qty,84)+(bm?'<td class="am" id="w'+k+'">'+f2(wd(r))+'</td>':ni(a,'wd',r.wd,84))+ni(a,'pct',r.pct,60)+'<td><input type="checkbox" '+a+'data-f="sub"'+(r.sub?' checked':'')+'></td><td class="am" id="a'+k+'">'+f2(amt(r))+'</td><td><button class="x" type="button" data-delr="'+k+'" aria-label="মুছুন">×</button></td></tr>'});
  h+='</table></div><button class="btn sm" type="button" data-addr="'+li+'">+ লাইন যোগ করুন</button>';
  if(bm&&B.length){
   h+='<div style="font-size:12.5px;color:var(--mut);margin:12px 0 4px">ব্লকভিত্তিক কাজ — ঘর ফাঁকা = কাজ হয়নি, x = প্রযোজ্য নয়, সংখ্যা = কত ইউনিট হয়েছে</div><div class="sc"><table class="in cm"><tr><th>Description</th>'+B.map(function(b,i){return '<th class="cc" title="ইউনিট '+b.u+'">'+(i+1)+'<br>'+esc(b.n)+'</th>'}).join('')+'<th></th></tr>';
   l.rows.forEach(function(r,ri){
    h+='<tr><td style="white-space:nowrap;font-size:12px">'+esc((r.z?r.z+' · ':'')+r.d)+'</td>'+B.map(function(b,ci){return '<td><input type="text" class="ci" data-l="'+li+'" data-r="'+ri+'" data-ci="'+ci+'" value="'+esc(r.c[ci])+'"></td>'}).join('')+'<td style="white-space:nowrap"><button class="btn sm" type="button" data-fill="'+li+'_'+ri+'">পূর্ণ</button> <button class="btn sm" type="button" data-clrc="'+li+'_'+ri+'">খালি</button></td></tr>'});
   h+='</table></div>'}
  h+='</div>'});
 h+='<button class="btn sm" type="button" id="add-l">+ নতুন গ্রুপ/লট</button><h3>স্বাক্ষর</h3><div class="g"><div><label>Prepared by — Name<span style="display:flex;gap:4px;align-items:center"><input type="text" data-k="prepName" value="'+esc(S.prepName)+'" placeholder="আপনার নাম লিখুন"><button class="x" type="button" data-clr="prepName" aria-label="নাম মুছুন">×</button></span></label></div>'+field('prepDate','Prepared by — Date')+field('recvName','Received by — Name')+field('recvDate','Received by — Date')+'</div>';
 $('form').innerHTML=h;
}

function claimSheets(){
 var c=calc(),sc=S.showCE;
 var info=[['PROGRESS CLAIM NO.',S.claimNo,'Date',S.date],['Project',S.project,'Person in-charge',S.incharge],['Sub-Contractor',S.sub,'Contact No',S.contact],['Scope of Work',S.scope,'Contract Value',S.contractValue]].map(function(r){return '<span>'+r[0]+'</span><span>: '+esc(r[1])+'</span><span>'+r[2]+'</span><span>: '+esc(r[3])+'</span>'}).join('');
 var pr=S.prev.map(function(p){return '<div class="lr"><span>'+esc(p.date)+'</span><span>'+esc(p.desc)+'</span><span class="a">'+(p.amt===''?'':f2(num(p.amt)))+'</span></div>'}).join('');
 var opt=function(raw){return raw===''||raw==null?'':f2(num(raw))};
 var R=function(k,lab,val,bx){return '<div class="rr"><span>'+k+'</span><span>'+lab+'</span><span>:</span><span class="v'+(bx?' bx':'')+'">'+val+'</span></div>'};
 var gap='<div style="height:14px"></div>';
 var right=R('(A)','Progress to Date',f2(c.A),1)+gap+R('(B)','Variation Work',opt(S.variation))+R('(C)','Total Progress Claim to Date',sc?f2(c.C):'')+gap+R('(D)','Retention '+esc(S.retPct)+'%',f2(c.D))+R('','Daywork/Additional Work',opt(S.daywork))+gap+R('(E)','Net Valuation',sc?f2(c.E):'')+gap+R('(F)','Less :-','')+R('','Previous payment',c.P?f2(c.P):'')+R('','Previous as at',opt(S.prevAsAt))+R('','Daywork/back-charged',opt(S.backcharged))+'<div style="height:22px;border-bottom:1px solid #000;margin-left:30px"></div>'+gap+R('','Add:Release of retention',opt(S.release));
 var p1='<div class="sheet" style="page-break-after:always"><div class="fr"><div class="t">'+esc(S.co)+'</div><div class="t">INTERIM VALUATION</div><div class="info">'+info+'</div>'+
  '<div class="main"><div class="l"><div class="h">Previous Payment</div><div class="lt"><span>Date</span><span>Description</span><span class="a">Amount</span></div><div class="lb">'+pr+'</div><div class="lbx">'+(c.P?f2(c.P):'')+'</div></div><div>'+right+'</div></div>'+
  '<div class="due"><div></div><div style="display:grid;grid-template-columns:1fr auto"><span>Amount due on this valuation</span><span style="border:1px solid #000;padding:3px 8px;min-width:90px;text-align:right">'+f2(c.due)+'</span></div></div></div>'+
  '<div class="sg"><div><div>PREPARED BY</div><div class="ln"></div><div class="nm"><span>NAME :</span><span>'+esc(S.prepName)+'</span></div><div class="nm"><span>DATE :</span><span>'+esc(S.prepDate)+'</span></div></div>'+
  '<div><div>RECEIVED BY</div><div class="ln"></div><div class="nm"><span>NAME :</span><span>'+esc(S.recvName)+'</span></div><div class="nm"><span>DATE :</span><span>'+esc(S.recvDate)+'</span></div></div></div></div>';
 var t='<table class="d"><colgroup><col style="width:29%"><col style="width:8%"><col style="width:11%"><col style="width:14%"><col style="width:14%"><col style="width:12%"><col></colgroup><tr><th>DESCRIPTION</th><th>UNIT</th><th>RATE (RM)</th><th>Qty</th><th>Workdone Unit</th><th>Workdone %</th><th>Amount<br>(RM)</th></tr>';
 S.lots.forEach(function(l){
  var sq=0;t+='<tr class="lotr"><td>'+esc(l.name)+'</td><td></td><td></td><td></td><td></td><td></td><td></td></tr>';
  l.rows.forEach(function(r){var w=wd(r);if(r.sub)sq+=num(r.qty);
   t+='<tr class="bl"><td>'+esc((r.z&&S.useBlocks?r.z+' - ':'')+r.d)+'</td><td class="c">'+esc(r.u)+'</td><td class="n">'+f2(num(r.rate))+'</td><td class="n">'+f2(num(r.qty))+'</td><td class="n">'+(w?f2(w):'-')+'</td><td class="n">'+(r.pct===''?100:num(r.pct))+'%</td><td class="n">'+f2(amt(r))+'</td></tr>'});
  t+='<tr class="sp"><td></td><td></td><td></td><td class="n">'+(sq?f2(sq):'')+'</td><td></td><td></td><td></td></tr><tr><td>&nbsp;</td><td></td><td></td><td></td><td></td><td></td><td></td></tr>'});
 t+='<tr><td colspan="2" style="text-align:center;font-weight:700">Total Amount</td><td></td><td></td><td></td><td></td><td class="n">'+f2(c.A)+'</td></tr></table>';
 return p1+'<div class="sheet"><div style="height:20px"></div>'+t+'</div>';
}
function msheet(){
 var B=blocks(),n=B.length,c=calc(),cs=Math.max(n,1),tot=n+8;
 var h='<div class="sheet ms"><div class="mh"><div>Project : '+esc(S.project)+'<br>Sub-Cont : '+esc(S.sub)+'<br>Trade : '+esc(S.trade)+'</div><div style="text-align:right">Progress Claim No : '+esc(S.claimNo)+'<br>Date : '+esc(S.date)+'</div></div>'+
 '<table class="m"><colgroup><col style="width:8%"><col style="width:14%"><col style="width:3%">'+(n?'':'<col>')+B.map(function(){return '<col>'}).join('')+'<col style="width:6%"><col style="width:6%"><col style="width:4%"><col style="width:4%"><col style="width:7%"></colgroup>'+
 '<tr><th rowspan="4">Item</th><th rowspan="4">Description</th><th rowspan="4">Unit</th><th colspan="'+cs+'">BLOCK</th><th rowspan="4">Total Unit Done</th><th rowspan="4">QTY</th><th rowspan="4">Rate</th><th rowspan="4">%</th><th rowspan="4">Amount<br>RM per unit</th></tr>'+
 '<tr>'+B.map(function(b,i){return '<th>'+(i+1)+'</th>'}).join('')+(n?'':'<th></th>')+'</tr><tr>'+B.map(function(b){return '<th>'+b.u+'</th>'}).join('')+(n?'':'<th></th>')+'</tr><tr>'+B.map(function(b){return '<th class="bn">'+esc(b.n)+'</th>'}).join('')+(n?'':'<th></th>')+'</tr>';
 S.lots.forEach(function(l,gi){
  h+='<tr class="gr"><td>'+String.fromCharCode(65+gi%26)+'</td><td colspan="'+(tot-1)+'">'+esc(l.name)+'</td></tr>';
  l.rows.forEach(function(r){
   h+='<tr><td class="z">'+esc(r.z)+'</td><td>'+esc(r.d)+'</td><td class="c">'+esc(r.u)+'</td>'+B.map(function(b,i){var v=(r.c||[])[i];return isX(v)?'<td class="xx"></td>':'<td class="c">'+(v===''||v==null?'':esc(v))+'</td>'}).join('')+(n?'':'<td></td>')+'<td class="n">'+(wd(r)?f2(wd(r)):'')+'</td><td class="n">'+(r.qty===''?'':f2(num(r.qty)))+'</td><td class="n">'+f2(num(r.rate))+'</td><td class="n">'+(r.pct===''?100:num(r.pct))+'%</td><td class="n">'+f2(amt(r))+'</td></tr>'})});
 return h+'<tr class="tt"><td colspan="'+(tot-1)+'">TOTAL AMOUNT</td><td class="n">'+f2(c.A)+'</td></tr></table></div>';
}
function W(){return S.useBlocks?1056:816}
function fit(){
 var st=$('stage'),w=W(),k=Math.min(1,(st.clientWidth-6)/w);if(!isFinite(k)||k<=0)k=1;
 var s=$('sheets');s.style.width=w+'px';s.style.transform='scale('+k+')';
 $('wrap').style.width=(w*k)+'px';$('wrap').style.height=(s.offsetHeight*k)+'px';
}
function render(){cellsFix();$('sheets').innerHTML=claimSheets()+(S.useBlocks?msheet():'');$('b-meas').style.display=S.useBlocks?'':'none';fit();save()}

/* ---------- ইভেন্ট ---------- */
var form=$('form');
form.addEventListener('focusin',function(e){if(e.target.dataset.k==='prepName')e.target.select()});
form.addEventListener('input',function(e){
 var t=e.target;
 if(t.dataset.k!==undefined)S[t.dataset.k]=t.value;
 else if(t.dataset.p!==undefined)S.prev[+t.dataset.p][t.dataset.f]=t.value;
 else if(t.dataset.ln!==undefined)S.lots[+t.dataset.ln].name=t.value;
 else if(t.dataset.l!==undefined){
  var r=S.lots[+t.dataset.l].rows[+t.dataset.r];
  if(t.dataset.ci!==undefined)r.c[+t.dataset.ci]=t.value;
  else r[t.dataset.f]=t.type==='checkbox'?(t.checked?1:0):t.value;
  var k=t.dataset.l+'_'+t.dataset.r,a=$('a'+k),w=$('w'+k);if(a)a.textContent=f2(amt(r));if(w)w.textContent=f2(wd(r));
 }else if(t.id==='ce')S.showCE=t.checked;
 else return;
 render();
});
form.addEventListener('change',function(e){
 var t=e.target;
 if(t.id==='ub'){S.useBlocks=t.checked;cellsFix();buildForm();render()}
 else if(t.id==='bsys'){S.bsys=t.value;if(t.value!=='custom'){S.btext=SYS[t.value];S.bdef=SYSU[t.value]}cellsFix();buildForm();render()}
 else if(t.dataset.k==='btext'||t.dataset.k==='bdef'){cellsFix();buildForm();render()}
});
form.addEventListener('click',function(e){
 var b=e.target.closest('button');if(!b)return;var d=b.dataset;
 if(d.clr){S[d.clr]='';var i=form.querySelector('[data-k="'+d.clr+'"]');i.value='';i.focus();render();return}
 if(b.id==='tpl-go'){
  var v=$('tpl').value;if(!v)return;
  if(!confirm('বর্তমান কাজের তালিকা বদলে যাবে। চালিয়ে যাবেন?'))return;
  if(v==='simple'){var s0=sample();S.lots=s0.lots;S.prev=s0.prev;S.useBlocks=false}
  else{S.lots=blockGroups();S.prev=[];S.useBlocks=true;S.bsys='unit';S.btext=SYS.unit;S.bdef=2}
  cellsFix();buildForm();render();return}
 if(b.id==='add-p')S.prev.push({date:'',desc:'',amt:''});
 else if(d.delp!==undefined)S.prev.splice(+d.delp,1);
 else if(b.id==='add-l')S.lots.push(lot('Lot '+(S.lots.length+1),[0,0,0,0,0,0]));
 else if(d.dup!==undefined){var c=JSON.parse(JSON.stringify(S.lots[+d.dup]));c.name+=' (copy)';S.lots.splice(+d.dup+1,0,c)}
 else if(d.dell!==undefined){if(!confirm('এই গ্রুপ মুছবেন?'))return;S.lots.splice(+d.dell,1)}
 else if(d.addr!==undefined)S.lots[+d.addr].rows.push({z:'',d:'',u:'m',rate:'',qty:'',wd:'',pct:100,sub:1,c:[]});
 else if(d.delr!==undefined){var p=d.delr.split('_');S.lots[+p[0]].rows.splice(+p[1],1)}
 else if(d.fill!==undefined){var q=d.fill.split('_'),rr=S.lots[+q[0]].rows[+q[1]],B=blocks();rr.c=B.map(function(bk,i){return isX(rr.c[i])?'x':String(bk.u)})}
 else if(d.clrc!==undefined){var q2=d.clrc.split('_'),r2=S.lots[+q2[0]].rows[+q2[1]];r2.c=r2.c.map(function(v){return isX(v)?'x':''})}
 else return;
 buildForm();render();
});
$('tabs').addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;
 Array.prototype.forEach.call(this.children,function(c){c.classList.toggle('on',c===b)});
 $('work').dataset.v=b.dataset.v;setTimeout(fit,0)});
$('b-clear').addEventListener('click',function(){
 if(!confirm('কাজের পরিমাণ, পেমেন্ট ও হিসাব খালি হবে। রেট ও আইটেম থাকবে। চালিয়ে যাবেন?'))return;
 S.prev=[];['variation','daywork','prevAsAt','backcharged','release','incharge','contractValue','recvName','recvDate'].forEach(function(k){S[k]=''});
 S.lots.forEach(function(l){l.rows.forEach(function(r){r.wd='';r.c=r.c.map(function(v){return isX(v)?'x':''})})});
 buildForm();render();
});
function fname(suf){var n=(S.fname||'Progress-Claim').replace(/[\\/:*?"<>|]/g,'').trim();return(n||'Progress-Claim')+(suf||'')+'.pdf'}
function makePDF(meas,btn){
 if(typeof html2pdf==='undefined'){toast('PDF টুল লোড হয়নি। ইন্টারনেট দেখে রিলোড করুন।');return}
 var lab=btn.textContent;btn.disabled=true;btn.textContent='তৈরি হচ্ছে...';
 var h=document.createElement('div');h.style.cssText='position:fixed;left:-99999px;top:0';var inn=document.createElement('div');inn.className='pdf';inn.style.cssText='width:'+(meas?1056:816)+'px;background:#fff';inn.innerHTML=meas?msheet():claimSheets();h.appendChild(inn);document.body.appendChild(h);
 var done=function(){document.body.removeChild(h);btn.disabled=false;btn.textContent=lab};
 html2pdf().set({margin:0,filename:fname(meas?'-Measurement':''),image:{type:'jpeg',quality:0.97},html2canvas:{scale:2,backgroundColor:'#fff'},jsPDF:{unit:'in',format:'letter',orientation:meas?'landscape':'portrait'},pagebreak:{mode:['css'],avoid:'tr'}})
  .from(inn).save().then(function(){toast('PDF ডাউনলোড হয়েছে।')}).catch(function(){toast('PDF তৈরি করা যায়নি। আবার চেষ্টা করুন।')}).then(done);
}
$('b-pdf').addEventListener('click',function(){makePDF(false,this)});
$('b-meas').addEventListener('click',function(){makePDF(true,this)});
$('b-print').addEventListener('click',function(){var p=document.title;document.title=fname().replace(/\.pdf$/,'');window.print();document.title=p});
window.addEventListener('beforeprint',function(){$('sheets').style.transform='none'});
window.addEventListener('afterprint',fit);
window.addEventListener('resize',fit);
if(window.self!==window.top)$('back').style.display='none';
cellsFix();buildForm();render();
})();
